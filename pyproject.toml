[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-designer"
version = "0.6.0"
description = "AI-assisted watch/phone housing designer (build123d + Claude + PyVista)"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}

dependencies = [
    # CAD kernel. PIN the OCCT line: cadquery-ocp wraps OCCT, whose EXACT geometry
    # outputs (volumes, bboxes, tessellation) are baked into the test suite's
    # exact-value assertions, the corpus baselines and the fidelity fixtures — all
    # calibrated to OCCT 7.8. An unpinned `>=7.7` silently pulls OCCT 7.9 in CI
    # (a fresh install), which shifts those exact assertions and fails the broad
    # suite even though the identical code passes 1964/0 locally on 7.8. Pin to the
    # validated 7.8 line for reproducible builds.
    "build123d>=0.9.0,<1.0",
    "cadquery-ocp>=7.7,<7.9",
    # Mesh (Phase 9 + reference glb)
    "trimesh>=4.4",
    "pygltflib>=1.16",
    "numpy>=1.26",
    "scipy>=1.13",
    # Visualization — GPU desktop
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "vtk>=9.3",
    "PySide6>=6.7",
    # LLM
    "anthropic>=0.40",
    # IO / validation
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # CLI
    "typer>=0.12",
    # 로깅 / 자격증명 / 안전 평가
    "loguru>=0.7",
    "keyring>=24",
    "simpleeval>=0.9.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]
mesh-advanced = ["pymeshlab"]
# mcp: run the modeller as an MCP server (python -m phone_designer.mcp_server)
# so an LLM client (Claude, …) can model + analyse parts by calling tools.
mcp = ["mcp>=1.0"]
# report-pdf: true .pdf export (text + embedded PNG views) via reportlab.
# Optional — the print-optimized self-contained HTML remains the
# dependency-free, high-fidelity deliverable; reportlab adds a low-fidelity
# real .pdf when installed (lights up _report_pdf's gated path automatically).
report-pdf = ["reportlab>=4"]
# fbx 의존성은 의도적으로 빼둠 (Rev 4 결정, glb only)

[project.scripts]
phone-designer = "phone_designer.cli:app"
phone-designer-mcp = "phone_designer.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phone_designer" = ["**/*.yaml", "**/*.json", "ui/i18n/*.po"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take >10s",
    "llm: tests that call real Claude API",
    "ui: tests that require Qt event loop",
    "requires_oem: tests that need OEM CAD (회사 컴 only)",
    "fidelity: round-trip RE pipeline fidelity gate (CI must-pass when FIDELITY_STRICT=1)",
]
