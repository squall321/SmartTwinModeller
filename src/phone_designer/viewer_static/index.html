<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartTwin CAD Viewer</title>
<style>
  :root { --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2733; --accent:#4682c8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:system-ui,Segoe UI,Roboto,sans-serif;
              color:var(--ink); background:var(--bg); }
  #app { display:flex; height:100%; }
  #side { width:260px; background:var(--panel); border-right:1px solid #dde1e6;
          display:flex; flex-direction:column; }
  #side h1 { font-size:14px; margin:0; padding:14px 16px; border-bottom:1px solid #eee;
             letter-spacing:.02em; }
  #bodies { flex:1; overflow:auto; }
  .body { padding:10px 16px; border-bottom:1px solid #f0f1f3; cursor:pointer; font-size:13px; }
  .body:hover { background:#eef4fb; }
  .body.sel { background:#e3eefb; border-left:3px solid var(--accent); padding-left:13px; }
  .body .id { font-weight:600; }
  .body .meta { color:#8a94a3; font-size:11px; margin-top:2px; }
  #stage { flex:1; position:relative; }
  #view { position:absolute; inset:0; }
  #hud { position:absolute; left:12px; bottom:12px; background:rgba(255,255,255,.85);
         padding:6px 10px; border-radius:6px; font-size:12px; color:#556; }
  #err { position:absolute; left:12px; top:12px; color:#b23; font-size:12px; }
  #sel { position:absolute; right:12px; top:12px; background:rgba(255,255,255,.92);
         padding:10px 12px; border-radius:6px; font-size:12px; max-width:280px;
         box-shadow:0 1px 6px rgba(0,0,0,.12); display:none; }
  #sel b { color:var(--accent); }
  #sel code { background:#eef2f7; padding:1px 4px; border-radius:3px; font-size:11px; }
  .btn { display:inline-block; margin:8px 16px; padding:6px 10px; font-size:12px;
         background:var(--accent); color:#fff; border:none; border-radius:5px; cursor:pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>SmartTwin CAD Viewer</h1>
    <button class="btn" onclick="loadBodies()">↻ 새로고침</button>
    <div id="bodies"></div>
  </div>
  <div id="stage">
    <div id="view"></div>
    <div id="hud">마우스: 드래그=회전 · 휠=줌 · 우클릭=이동 · 면 클릭=선택</div>
    <div id="err"></div>
    <div id="sel"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f6f8);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(1,1,1); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-1,-0.5,-1); scene.add(fill);
const grid = new THREE.GridHelper(400, 40, 0xcfd6df, 0xe4e9ef);
grid.rotation.x = Math.PI/2; scene.add(grid);   // GLB is +Z up → put grid on XY

const loader = new GLTFLoader();
let current = null;
let currentBodyId = null;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let marker = null;   // small sphere at the picked point

function resize(){
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view); resize();

function frameObject(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) || 10;
  controls.target.copy(center);
  camera.position.set(center.x + r*1.4, center.y - r*1.6, center.z + r*1.2);
  camera.near = r/100; camera.far = r*100; camera.updateProjectionMatrix();
  controls.update();
}

window.loadBody = async function(bodyId){
  document.getElementById('err').textContent = '';
  currentBodyId = bodyId;
  document.querySelectorAll('.body').forEach(e=>e.classList.toggle('sel', e.dataset.id===bodyId));
  if (current){ scene.remove(current); current.traverse(o=>{o.geometry&&o.geometry.dispose();}); current=null; }
  if (marker){ scene.remove(marker); marker=null; }
  document.getElementById('sel').style.display='none';
  try {
    const gltf = await loader.loadAsync('/model/'+encodeURIComponent(bodyId)+'.glb');
    const root = gltf.scene;
    // solid steel-blue material so it reads as CAD (GLB has no material here)
    const mat = new THREE.MeshStandardMaterial({ color:0x4682c8, metalness:0.1, roughness:0.65,
                                                 side:THREE.DoubleSide, flatShading:false });
    let nPrim = 0;
    root.traverse(o=>{ if (o.isMesh){ o.material = mat; nPrim++; } });
    scene.add(root); current = root; frameObject(root);
    document.getElementById('hud').textContent =
      `${bodyId} · ${nPrim} face-primitive · 드래그=회전 휠=줌`;
  } catch(e){
    document.getElementById('err').textContent = '로드 실패: ' + e.message;
  }
};

window.loadBodies = async function(){
  const r = await fetch('/api/bodies'); const d = await r.json();
  const list = document.getElementById('bodies');
  list.innerHTML = '';
  if (!d.bodies.length){ list.innerHTML = '<div class="body">워크스페이스에 body 없음<br><span class="meta">MCP로 cad_generate 후 새로고침</span></div>'; return; }
  for (const b of d.bodies){
    const el = document.createElement('div');
    el.className = 'body'; el.dataset.id = b.body_id;
    el.innerHTML = `<div class="id">${b.body_id}</div><div class="meta">${b.step} · ${b.size_kb} KB</div>`;
    el.onclick = ()=>loadBody(b.body_id);
    list.appendChild(el);
  }
  loadBody(d.bodies[0].body_id);   // auto-show the newest
};

// ── face PICK: click a face → server resolves the OCCT face → show selector ──
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', async e => {
  // only treat as a pick if the pointer didn't drag (that's a rotate)
  if (!downPos || !current || !currentBodyId) return;
  const moved = Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]);
  downPos = null;
  if (moved > 5 || e.button !== 0) return;   // dragged = orbit, not a pick

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX-rect.left)/rect.width)*2 - 1;
  pointer.y = -((e.clientY-rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(current, true);
  if (!hits.length){ document.getElementById('sel').style.display='none'; return; }
  const p = hits[0].point;   // 3D world point on the surface

  // marker at the pick
  if (marker) scene.remove(marker);
  const box = new THREE.Box3().setFromObject(current);
  const r = box.getSize(new THREE.Vector3()).length() * 0.012 || 0.5;
  marker = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                          new THREE.MeshBasicMaterial({ color:0xff5533 }));
  marker.position.copy(p); scene.add(marker);

  // ask the server which OCCT face that is (nearest-centroid)
  try {
    const resp = await fetch('/pick', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ body_id: currentBodyId, point:[p.x, p.y, p.z] }) });
    const s = await resp.json();
    const box = document.getElementById('sel');
    if (!s.ok){ box.style.display='none'; return; }
    const sel = JSON.stringify(s.selector);
    box.style.display='block';
    box.innerHTML =
      `<b>면 선택됨</b> · face #${s.face_idx} (${s.surface_type})<br>` +
      `centroid [${s.centroid.join(', ')}]<br>` +
      `area ${s.area_mm2} mm²<br><br>` +
      `Claude에게: <i>"방금 클릭한 면을 3mm 필렛해줘"</i><br>` +
      `<span style="color:#8a94a3">selector: <code>${sel}</code></span>`;
  } catch(err){ document.getElementById('err').textContent = 'pick 실패: '+err.message; }
});

(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
loadBodies();
</script>
</body>
</html>
