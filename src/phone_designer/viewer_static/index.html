<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartTwin CAD Viewer</title>
<style>
  :root { --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2733; --accent:#4682c8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden;  /* fullscreen app — a page
              scrollbar toggling on canvas resize oscillates the whole layout */
              font-family:system-ui,Segoe UI,Roboto,sans-serif;
              color:var(--ink); background:var(--bg); }
  #app { display:flex; height:100%; }
  #side { width:260px; background:var(--panel); border-right:1px solid #dde1e6;
          display:flex; flex-direction:column; overflow:hidden; }
  #side h1 { font-size:14px; margin:0; padding:14px 16px; border-bottom:1px solid #eee;
             letter-spacing:.02em; }
  #bodies { flex:1; overflow:auto; min-height:0; }  /* min-height:0 defeats the flexbox
              min-height:auto trap: 27 bodies must scroll INSIDE, not blow out the page */
  .body { padding:10px 16px; border-bottom:1px solid #f0f1f3; cursor:pointer; font-size:13px; }
  .body:hover { background:#eef4fb; }
  .body.sel { background:#e3eefb; border-left:3px solid var(--accent); padding-left:13px; }
  .body .id { font-weight:600; }
  .body .meta { color:#8a94a3; font-size:11px; margin-top:2px; }
  #stage { flex:1; position:relative; }
  #view { position:absolute; inset:0; }
  #hud { position:absolute; left:12px; bottom:12px; background:rgba(255,255,255,.85);
         padding:6px 10px; border-radius:6px; font-size:12px; color:#556; }
  #err { position:absolute; left:12px; top:12px; color:#b23; font-size:12px; }
  #sel { position:absolute; right:12px; top:100px; background:rgba(255,255,255,.92);
         /* below the #section bar (audit: at top:56 it covered the section
            controls — Z/slider clicks were swallowed while a selection showed) */
         padding:10px 12px; border-radius:6px; font-size:12px; max-width:280px;
         box-shadow:0 1px 6px rgba(0,0,0,.12); display:none; }
  #sel b { color:var(--accent); }
  #sel code { background:#eef2f7; padding:1px 4px; border-radius:3px; font-size:11px; }
  .btn { display:inline-block; margin:8px 16px; padding:6px 10px; font-size:12px;
         background:var(--accent); color:#fff; border:none; border-radius:5px; cursor:pointer; }
  /* camera presets + unit chip toolbar, top-right of the stage */
  #toolbar { position:absolute; right:12px; top:12px; display:flex; gap:6px; align-items:center; }
  #toolbar button { padding:5px 9px; font-size:12px; background:var(--panel);
                    color:var(--ink); border:1px solid #cfd6df; border-radius:5px; cursor:pointer; }
  #toolbar button:hover { background:#eef4fb; border-color:var(--accent); }
  #mmchip { padding:5px 9px; font-size:11px; font-weight:600; background:#eef2f7;
            color:#556; border:1px solid #dde1e6; border-radius:5px; }
  /* drag-consumed hint (transient) */
  #dragHint { position:absolute; left:50%; top:14px; transform:translateX(-50%);
              background:rgba(31,39,51,.82); color:#fff; padding:4px 10px; border-radius:12px;
              font-size:11px; opacity:0; transition:opacity .18s; pointer-events:none; }
  #dragHint.show { opacity:1; }
  /* ── V3 FEATURE OVERLAY: collapsible sidebar section listing detected features ── */
  #features { border-top:1px solid #eee; }
  #featHead { padding:10px 16px; font-size:12px; font-weight:600; cursor:pointer;
              display:flex; justify-content:space-between; align-items:center;
              user-select:none; background:#fafbfc; }
  #featHead:hover { background:#eef4fb; }
  #featHead .caret { color:#8a94a3; font-size:11px; transition:transform .15s; }
  #features.collapsed .caret { transform:rotate(-90deg); }
  #features.collapsed #featList { display:none; }
  #featList { max-height:34vh; overflow:auto; }
  .feat { padding:7px 16px; border-bottom:1px solid #f4f5f7; cursor:pointer; font-size:12px; }
  .feat:hover, .feat.on { background:#fff2e5; }        /* warm hover matches ACCENT */
  .feat.on { border-left:3px solid #ff8c1a; padding-left:13px; }
  .feat .ft { font-weight:600; }
  .feat .fm { color:#8a94a3; font-size:11px; margin-top:1px; }
  .feat.empty { color:#8a94a3; cursor:default; }
  .feat.empty:hover { background:transparent; }
  /* ── V3 SECTION SLIDER: axis buttons + slider, below the toolbar ── */
  #section { position:absolute; right:12px; top:52px; background:rgba(255,255,255,.94);
             padding:8px 10px; border-radius:6px; font-size:12px; display:flex; gap:6px;
             align-items:center; box-shadow:0 1px 6px rgba(0,0,0,.10); }
  #section button { padding:4px 8px; font-size:12px; background:var(--panel);
                    color:var(--ink); border:1px solid #cfd6df; border-radius:5px; cursor:pointer; }
  #section button:hover { background:#eef4fb; border-color:var(--accent); }
  #section button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #secSlider { width:120px; }
  #secSlider:disabled { opacity:.4; }
  #btnMeasure.on { background:#ff8c1a; color:#fff; border-color:#ff8c1a; }
  /* ── V3 MEASURE: floating readout for point-to-point client distance ── */
  #measure { position:absolute; left:12px; top:36px; background:rgba(255,255,255,.94);
             padding:8px 10px; border-radius:6px; font-size:12px; color:#334;
             box-shadow:0 1px 6px rgba(0,0,0,.10); display:none; max-width:240px; }
  #measure b { color:#e07b00; }
  #measure .hint { color:#8a94a3; font-size:11px; }
  /* ── MULTI-BODY / ASSEMBLY: component panel (color / select / isolate bodies) ── */
  /* Hidden for a single-part body (n_components<=1) so a solo solid stays clutter-free. */
  #components { border-top:1px solid #eee; display:none; }        /* shown only when n>1 */
  #compHead { padding:10px 16px; font-size:12px; font-weight:600; cursor:pointer;
              display:flex; justify-content:space-between; align-items:center;
              user-select:none; background:#fafbfc; gap:8px; }
  #compHead:hover { background:#eef4fb; }
  #compHead .caret { color:#8a94a3; font-size:11px; transition:transform .15s; }
  #components.collapsed .caret { transform:rotate(-90deg); }
  #components.collapsed #compBody { display:none; }
  /* Uniform / By-component colour toggle + Show-all sit in a control strip. */
  #compCtrl { padding:6px 16px; display:flex; gap:6px; align-items:center;
              border-bottom:1px solid #f0f1f3; background:#fff; }
  #compCtrl button { padding:4px 8px; font-size:11px; background:var(--panel);
                     color:var(--ink); border:1px solid #cfd6df; border-radius:5px; cursor:pointer; }
  #compCtrl button:hover { background:#eef4fb; border-color:var(--accent); }
  #compCtrl button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #compList { max-height:34vh; overflow:auto; }
  .comp { padding:7px 10px 7px 16px; border-bottom:1px solid #f4f5f7; cursor:pointer;
          font-size:12px; display:flex; align-items:center; gap:8px; }
  .comp:hover, .comp.hov, .comp.on { background:#eef4fb; }
  .comp.on { border-left:3px solid var(--accent); padding-left:13px; }
  .comp .swatch { width:12px; height:12px; border-radius:3px; flex:0 0 auto;
                  border:1px solid rgba(0,0,0,.15); }
  .comp .ctext { flex:1; min-width:0; }
  .comp .cn { font-weight:600; }
  .comp .cm { color:#8a94a3; font-size:11px; margin-top:1px; }
  /* isolate (eye) toggle per row — click hides that component's faces */
  .comp .eye { flex:0 0 auto; width:22px; text-align:center; font-size:13px;
               color:#8a94a3; border-radius:4px; padding:2px 0; user-select:none; }
  .comp .eye:hover { background:#dbe6f5; color:var(--accent); }
  .comp.hidden { opacity:.5; }
  .comp.hidden .cn { text-decoration:line-through; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>SmartTwin CAD Viewer</h1>
    <button class="btn" onclick="loadBodies()">↻ 새로고침</button>
    <div id="bodies"></div>
    <!-- V3 FEATURE OVERLAY: collapsible list of detected holes/pockets/bosses -->
    <div id="features" class="collapsed">
      <div id="featHead"><span id="featSummary">Features</span><span class="caret">▾</span></div>
      <div id="featList"></div>
    </div>
    <!-- MULTI-BODY / ASSEMBLY: component panel (shown only when n_components>1) -->
    <div id="components">
      <div id="compHead"><span id="compSummary">Components</span><span class="caret">▾</span></div>
      <div id="compBody">
        <div id="compCtrl">
          <button id="compUniform" class="on" title="모든 body 단색(steel-blue)">Uniform</button>
          <button id="compByComp" title="body마다 고유 색">By-component</button>
          <button id="compShowAll" title="숨긴 body 모두 표시">Show all</button>
        </div>
        <div id="compList"></div>
      </div>
    </div>
  </div>
  <div id="stage">
    <div id="view"></div>
    <div id="toolbar">
      <button id="btnReset" title="프레임 리셋">Reset</button>
      <button id="btnFront" title="정면(+Y에서)">Front</button>
      <button id="btnTop"   title="위(+Z에서)">Top</button>
      <button id="btnIso"   title="아이소메트릭">Iso</button>
      <button id="btnMeasure" title="두 면 클릭 → 점-점 거리(클릭 거리)">Measure</button>
      <span id="mmchip">mm · —</span>
    </div>
    <!-- V3 SECTION SLIDER: X/Y/Z axis + 0..1 slider swap the DISPLAYED glb (transient) -->
    <div id="section">
      <span style="color:#556;">Section</span>
      <button id="secX" data-axis="x" title="X 단면">X</button>
      <button id="secY" data-axis="y" title="Y 단면">Y</button>
      <button id="secZ" data-axis="z" title="Z 단면">Z</button>
      <input id="secSlider" type="range" min="0" max="1" step="0.01" value="0.5" disabled>
      <button id="secOff" title="단면 끄기 → 원본 복원">OFF</button>
    </div>
    <div id="hud">마우스: 드래그=회전 · 휠=줌 · 우클릭=이동 · 면 클릭=선택</div>
    <div id="err"></div>
    <div id="dragHint">orbit (not a pick)</div>
    <!-- V3 MEASURE readout (point-to-point client distance) -->
    <div id="measure"></div>
    <div id="sel"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f6f8);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(1,1,1); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-1,-0.5,-1); scene.add(fill);
// The rendered scene is Y-UP: GLB vertices are OCCT-frame metres and the glTF
// node quaternion (−90°X) maps OCCT +Z → scene +Y (audit: the old `rotation.x`
// stood the grid up as a WALL through the model, and presets aimed at the
// wrong OCCT axes with a view-parallel up vector → rolled, unrepeatable poses).
// OCCT (x,y,z) → scene (x, z, −y).
const grid = new THREE.GridHelper(400, 40, 0xcfd6df, 0xe4e9ef);
scene.add(grid);   // GridHelper's default XZ plane IS the ground in a Y-up scene

const loader = new GLTFLoader();
let current = null;
let currentBodyId = null;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let marker = null;   // small sphere at the picked point

// ── F1/V-보조 pick state ──
// faceMeshes[] holds each face Mesh IN TRAVERSE ORDER — its index is the OCCT face_idx
// the GLB emits one primitive per OCCT face in _all_faces() order (1:1), so the traverse
// index the browser hits IS the server's face index. No coordinate conversion needed.
let faceMeshes = [];
let highlighted = null;          // { mesh, color }  — the currently accented face
const ACCENT = new THREE.Color(0xff8c1a);      // orange highlight
const BASE_COLOR = 0x4682c8;

// ── V3 FEATURE OVERLAY state ──
// A feature = a SET of face primitives (its face_indices). featHi[] holds the
// restore records for the currently-highlighted feature set so we can un-accent
// them exactly (mirrors the single-pick `highlighted`, but over many meshes).
let sceneFeatures = [];          // [{id,type,kind,face_indices,centroid,label,sub}]
let featHi = [];                 // [{ mesh, color }] — faces accented for a feature

// last framed geometry (center + radius) so camera presets can reuse it
let framed = { center: new THREE.Vector3(), r: 10 };

let _lastW = 0, _lastH = 0;
function resize(){
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h || (w === _lastW && h === _lastH)) return;  // no-op on same size:
  _lastW = w; _lastH = h;       // breaks any ResizeObserver→setSize feedback cycle
  renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view); resize();

function frameObject(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) || 10;
  framed.center.copy(center); framed.r = r;
  controls.target.copy(center);
  camera.up.set(0, 1, 0);                       // ALWAYS reset (audit: presets left
  // a mutated up behind → the next Reset/preset inherited a rolled pose)
  // iso from OCCT front-right-top: OCCT (+1.4, −1.6, +1.2)·r → scene (x, z, −y)
  camera.position.set(center.x + r*1.4, center.y + r*1.2, center.z + r*1.6);
  camera.near = r/100; camera.far = r*100; camera.updateProjectionMatrix();
  grid.scale.setScalar(Math.max(r / 100, 1e-4));   // grid ≈ 4·r, not 400 metres
  grid.position.y = box.min.y;                     // ground under the part
  controls.update();
  // mm chip: OCCT x × y × z order (scene y=OCCT z, scene z=OCCT y); metres → mm
  const mm = v => (v*1000).toFixed(1);
  document.getElementById('mmchip').textContent =
    `mm · ${mm(size.x)} × ${mm(size.z)} × ${mm(size.y)}`;
}

// Camera presets — OCCT-semantic views mapped into the Y-up scene, each with an
// EXPLICIT perpendicular up (audit: up ∥ view direction made lookAt degenerate —
// the 'Top' preset rolled arbitrarily and aimed at the wrong wall).
function viewAlong(dir, up){
  const c = framed.center, r = framed.r || 10;
  const d = dir.clone().normalize().multiplyScalar(r * 2.4);
  camera.up.copy(up);
  camera.position.copy(c).add(d);
  controls.target.copy(c);
  camera.near = r/100; camera.far = r*100; camera.updateProjectionMatrix();
  controls.update();
}
document.getElementById('btnReset').onclick = ()=>{ if (current) frameObject(current); };
// FRONT = view from OCCT −Y → scene (0,0,+1); screen-up = OCCT +Z → scene +Y
document.getElementById('btnFront').onclick = ()=>
  viewAlong(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 1, 0));
// TOP = view from OCCT +Z → scene (0,+1,0); screen-up = OCCT +Y → scene −Z
document.getElementById('btnTop').onclick = ()=>
  viewAlong(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, -1));
// ISO = view from OCCT (1,−1,0.8) → scene (1, 0.8, 1)
document.getElementById('btnIso').onclick = ()=>
  viewAlong(new THREE.Vector3(1, 0.8, 1), new THREE.Vector3(0, 1, 0));

function clearHighlight(){
  if (highlighted){
    highlighted.mesh.material.color.setHex(highlighted.color);
    highlighted.mesh.material.emissive.setHex(0x000000);
    highlighted = null;
  }
}

// ── V3 FEATURE OVERLAY: accent an arbitrary SET of face primitives ──
// Reuses the exact same ACCENT + emissive approach as single-pick highlight,
// applied over every face_index of the feature. clearFeatureHighlight restores.
function clearFeatureHighlight(){
  for (const h of featHi){
    if (!h.mesh) continue;
    h.mesh.material.color.setHex(h.color);
    h.mesh.material.emissive.setHex(0x000000);
  }
  featHi = [];
}
function highlightFaces(indices){
  clearFeatureHighlight();
  // faceMeshes[] is the REAL body's face array; while a transient section is
  // displayed those meshes aren't in the scene, so feature highlight is a no-op.
  if (sectionAxis) return;
  for (const idx of (indices || [])){
    const m = faceMeshes[idx];
    if (!m || !m.material) continue;  // idx out of range / disposed (defensive)
    featHi.push({ mesh: m, color: m.material.color.getHex() });
    m.material.color.copy(ACCENT);
    m.material.emissive.copy(ACCENT);
    m.material.emissiveIntensity = 0.4;
  }
}

window.loadBody = async function(bodyId){
  currentMtime = 0;   // re-init from the next /api/bodies poll (same-stem reload)
  document.getElementById('err').textContent = '';
  currentBodyId = bodyId;
  document.querySelectorAll('.body').forEach(e=>e.classList.toggle('sel', e.dataset.id===bodyId));
  clearHighlight();
  clearFeatureHighlight();
  resetComponents();       // a new body → drop the previous body's component panel
  resetSection();          // a new body → drop any transient section view
  resetMeasure();          // and any in-progress measurement
  faceMeshes = [];
  if (current){ scene.remove(current); current.traverse(o=>{o.geometry&&o.geometry.dispose(); o.material&&o.material.dispose&&o.material.dispose();}); current=null; }
  if (marker){ scene.remove(marker); marker=null; }
  document.getElementById('sel').style.display='none';
  try {
    await loadGlbInto('/model/'+encodeURIComponent(bodyId)+'.glb', true);
    document.getElementById('hud').textContent =
      `${bodyId} · ${faceMeshes.length} face-primitive · 드래그=회전 휠=줌`;
    loadScene(bodyId);        // fire-and-forget: populate the feature sidebar
    loadComponents(bodyId);   // fire-and-forget: populate the assembly component panel
  } catch(e){
    document.getElementById('err').textContent = '로드 실패: ' + e.message;
  }
};

// ── shared GLB loader: used by the primary /model load AND the transient
//    /section swap. `rebuildFaces` is true only for the real body (so
//    faceMeshes[] stays the OCCT-face-index array); a section is a throwaway
//    view whose primitives do NOT correspond to the body's OCCT faces. ──
async function loadGlbInto(url, rebuildFaces){
  const gltf = await loader.loadAsync(url);
  const root = gltf.scene;
  // solid steel-blue material so it reads as CAD (GLB has no material here).
  // CLONE per face so per-face highlight colour works (shared material would recolour all).
  const mat = new THREE.MeshStandardMaterial({ color:BASE_COLOR, metalness:0.1, roughness:0.65,
                                               side:THREE.DoubleSide, flatShading:false });
  if (rebuildFaces) faceMeshes = [];
  root.traverse(o=>{ if (o.isMesh){ o.material = mat.clone(); if (rebuildFaces) faceMeshes.push(o); } });
  if (current){ scene.remove(current); current.traverse(o=>{o.geometry&&o.geometry.dispose(); o.material&&o.material.dispose&&o.material.dispose();}); }
  scene.add(root); current = root; frameObject(root);
  return root;
}

window.loadBodies = async function(){
  const r = await fetch('/api/bodies'); const d = await r.json();
  const list = document.getElementById('bodies');
  list.innerHTML = '';
  if (!d.bodies.length){ list.innerHTML = '<div class="body">워크스페이스에 body 없음<br><span class="meta">MCP로 cad_generate 후 새로고침</span></div>'; return; }
  for (const b of d.bodies){
    const el = document.createElement('div');
    el.className = 'body'; el.dataset.id = b.body_id;
    el.innerHTML = `<div class="id">${b.body_id}</div><div class="meta">${b.step} · ${b.size_kb} KB</div>`;
    el.onclick = ()=>loadBody(b.body_id);
    list.appendChild(el);
  }
  loadBody(d.bodies[0].body_id);   // auto-show the newest
};

// ══════════════════════════════════════════════════════════════════════════
// V3 (1) FEATURE OVERLAY — fetch /scene?body_id → sidebar list of detected
// holes / pockets / bosses. Each row highlights its face_indices (a feature =
// a SET of face primitives → highlightFaces) and, on click, stashes its
// representative face via POST /pick {face_idx: first face_index} so Claude
// can act on it. Turns 'orbit a blue blob' into 'here are your 4 holes'.
// ══════════════════════════════════════════════════════════════════════════
const featHead = document.getElementById('featHead');
const featList = document.getElementById('featList');
const featSummary = document.getElementById('featSummary');
const featuresBox = document.getElementById('features');
featHead.onclick = ()=> featuresBox.classList.toggle('collapsed');

// The /scene contract carries the extract_feature_catalog output. Normalise it
// into a flat list of {kind,id,type,face_indices,centroid,label,sub} regardless
// of whether the server returns a pre-flattened `features` array or the raw
// `feature_catalog` dict keyed by kind (holes/pockets/bosses/...).
const FEATURE_KINDS = ['holes','pockets','bosses','ribs','lugs'];
function normaliseScene(d){
  if (Array.isArray(d && d.features)) return d.features;   // server already flattened
  // ACTUAL server contract (audit finding): /scene sends {features:{holes:[...],…}}
  // — a DICT under `features`. Accept it FIRST; the older fallbacks stay behind it.
  const cat = (d && ((d.features && typeof d.features === 'object') ? d.features
                     : (d.feature_catalog || d.catalog))) || d || {};
  const out = [];
  for (const kind of FEATURE_KINDS){
    const arr = cat[kind];
    if (!Array.isArray(arr)) continue;
    for (const f of arr){
      out.push({
        kind, id: f.id, type: f.type,
        face_indices: f.face_indices || [],
        centroid: f.centroid || f.entry_origin || f.axis_origin || null,
        diameters_mm: f.diameters_mm, depth_mm: f.depth_mm,
      });
    }
  }
  return out;
}
function featLabel(f){
  const kindName = { holes:'Hole', pockets:'Pocket', bosses:'Boss',
                     ribs:'Rib', lugs:'Lug' }[f.kind] || (f.kind||'Feature');
  let sub = f.type || '';
  if (f.diameters_mm && f.diameters_mm.length) sub += (sub?' · ':'') + '⌀' + f.diameters_mm[0] + 'mm';
  if (typeof f.depth_mm === 'number')          sub += (sub?' · ':'') + 'depth ' + f.depth_mm + 'mm';
  sub += (sub?' · ':'') + (f.face_indices.length) + ' face';
  return { title: `${kindName} #${f.id}`, sub };
}
function sceneSummary(feats){
  const by = {};
  for (const f of feats) by[f.kind] = (by[f.kind]||0) + 1;
  const parts = [];
  const label = { holes:'holes', pockets:'pockets', bosses:'bosses', ribs:'ribs', lugs:'lugs' };
  for (const k of FEATURE_KINDS) if (by[k]) parts.push(`${by[k]} ${label[k]}`);
  return parts.length ? 'Features: ' + parts.join(', ') : 'Features: none detected';
}

async function loadScene(bodyId){
  sceneFeatures = [];
  featList.innerHTML = '';
  featSummary.textContent = 'Features …';
  try {
    const r = await fetch('/scene?body_id=' + encodeURIComponent(bodyId));
    if (!r.ok){ featSummary.textContent = 'Features: (unavailable)'; return; }
    const d = await r.json();
    if (bodyId !== currentBodyId) return;            // body changed while fetching
    sceneFeatures = normaliseScene(d);
    renderFeatureList();
  } catch(_){
    featSummary.textContent = 'Features: (unavailable)';
  }
}

function renderFeatureList(){
  featSummary.textContent = sceneSummary(sceneFeatures);
  featList.innerHTML = '';
  if (!sceneFeatures.length){
    const e = document.createElement('div');
    e.className = 'feat empty';
    e.textContent = '검출된 피처 없음';
    featList.appendChild(e);
    return;
  }
  sceneFeatures.forEach((f, i)=>{
    const { title, sub } = featLabel(f);
    const row = document.createElement('div');
    row.className = 'feat'; row.dataset.i = i;
    row.innerHTML = `<div class="ft">${title}</div><div class="fm">${sub}</div>`;
    // HOVER → highlight this feature's face_indices set (reuses ACCENT material)
    row.onmouseenter = ()=> highlightFaces(f.face_indices);
    row.onmouseleave = ()=> { if (!row.classList.contains('on')) clearFeatureHighlight(); };
    // CLICK → keep it highlighted + stash its representative face for Claude
    row.onclick = ()=> selectFeature(i);
    featList.appendChild(row);
  });
}

async function selectFeature(i){
  const f = sceneFeatures[i];
  if (!f) return;
  featList.querySelectorAll('.feat').forEach(e=> e.classList.toggle('on', +e.dataset.i === i));
  highlightFaces(f.face_indices);
  const faceIdx = (f.face_indices && f.face_indices.length) ? f.face_indices[0] : null;
  if (faceIdx == null || !currentBodyId) return;
  // Stash the representative face (first face_index) via the SAME /pick path a
  // manual click uses — so 'clicked a hole in the list' == 'picked its face'.
  try {
    const resp = await fetch('/pick', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ body_id: currentBodyId, face_idx: faceIdx }) });
    const s = await resp.json();
    const selBox = document.getElementById('sel');
    if (!s.ok){ selBox.style.display='none'; return; }
    const { title } = featLabel(f);
    selBox.style.display='block';
    selBox.innerHTML =
      `<b>${title} 선택됨</b> · face #${s.face_idx} (${s.surface_type})<br>` +
      `centroid [${s.centroid.join(', ')}]<br>` +
      `area ${s.area_mm2} mm²<br><br>` +
      `Claude에게: <i>"방금 고른 ${title}을(를) 처리해줘"</i><br>` +
      `<span style="color:#8a94a3">selector: <code>${JSON.stringify(s.selector)}</code></span>`;
  } catch(err){ document.getElementById('err').textContent = 'pick 실패: '+err.message; }
}

// ══════════════════════════════════════════════════════════════════════════
// MULTI-BODY / ASSEMBLY — component panel. Fetch /components?body_id → per-body
// face_index ranges (the server's keystone: each solid's OCCT faces map 1:1 onto
// faceMeshes[] by traverse order). With that map the browser can:
//   (2) COLOR-BY-COMPONENT — a distinct hue per body over its face_indices,
//   (3) HOVER→accent all its faces · CLICK→select (POST /pick its 1st face) + dim,
//   (4) ISOLATE — eye toggle hides a body's faceMeshes so you see behind it.
// A single-solid body (n_components<=1) has ONE component → panel hidden (no clutter).
// Reuses faceMeshes[]/highlightFaces()/clearFeatureHighlight() from the feature overlay.
// ══════════════════════════════════════════════════════════════════════════
const componentsBox = document.getElementById('components');
const compHead      = document.getElementById('compHead');
const compSummary   = document.getElementById('compSummary');
const compList      = document.getElementById('compList');
const compUniformBtn= document.getElementById('compUniform');
const compByCompBtn = document.getElementById('compByComp');
const compShowAllBtn= document.getElementById('compShowAll');
compHead.onclick = ()=> componentsBox.classList.toggle('collapsed');

let sceneComponents = [];        // [{index,label,face_indices,face_count,volume_mm3,hue}]
let compColorMode = 'uniform';   // 'uniform' | 'bycomponent'
let compHovered = -1;            // row index currently hover-accented (-1 = none)
let compSelected = -1;           // row index currently click-selected (-1 = none)
const compHidden = new Set();    // component indices whose faceMeshes are visible=false

// Distinct-hue palette: even HSL spread so N bodies read as N parts. Colours are
// resolved per-component from its index so the swatch, the mesh tint, and the
// selection ring all agree. Kept as THREE.Color for direct material.color.copy.
function compHue(i, n){ return (i / Math.max(1, n)) % 1; }
function compColor(i, n){ return new THREE.Color().setHSL(compHue(i, n), 0.55, 0.55); }
function compSwatchCss(i, n){
  const c = compColor(i, n); return `#${c.getHexString()}`;
}

// Normalise the /components contract defensively (mirrors normaliseScene): accept
// {components:[...]} or a bare array, and either {index}/{id} + {face_indices} +
// {face_count}/{n_faces} + {volume_mm3}/{volume}. face_indices are GLB primitive
// indices (== faceMeshes[] indices) — clamp to the loaded face count.
function normaliseComponents(d){
  const raw = Array.isArray(d) ? d
            : (d && (d.components || d.bodies || d.solids)) || [];
  const n = raw.length;
  const out = [];
  raw.forEach((c, i)=>{
    const fis = (c.face_indices || c.faces || [])
      .map(x=> +x)
      .filter(x=> Number.isInteger(x) && x >= 0 && x < faceMeshes.length);
    out.push({
      index: (c.index != null ? c.index : (c.id != null ? c.id : i)),
      label: c.label || c.name || `Body ${i + 1}`,
      face_indices: fis,
      face_count: (c.face_count != null ? c.face_count
                 : (c.n_faces != null ? c.n_faces : fis.length)),
      volume_mm3: (c.volume_mm3 != null ? c.volume_mm3
                 : (c.volume != null ? c.volume : null)),
      hue: compSwatchCss(i, n),
    });
  });
  return out;
}

function componentCountFrom(d, list){
  const n = (d && (d.n_components != null ? d.n_components
                 : (d.count != null ? d.count : null)));
  return (n != null) ? n : list.length;
}

// Reset the panel to its empty/hidden state. Restores any hidden faceMeshes and
// re-applies the current colour mode's baseline so a body switch never leaks a
// hidden mesh or a stray tint into the next body. Called by loadBody().
function resetComponents(){
  sceneComponents = [];
  compHovered = -1;
  compSelected = -1;
  compHidden.clear();
  compList.innerHTML = '';
  compSummary.textContent = 'Components';
  componentsBox.style.display = 'none';
  componentsBox.classList.remove('collapsed');
}

async function loadComponents(bodyId){
  resetComponents();
  try {
    const r = await fetch('/components?body_id=' + encodeURIComponent(bodyId));
    if (!r.ok) return;                                  // endpoint absent/err → stay hidden
    const d = await r.json();
    if (bodyId !== currentBodyId) return;               // body changed while fetching
    if (d && d.ok === false) return;                    // honest server refusal
    const list = normaliseComponents(d);
    const n = componentCountFrom(d, list);
    // Single part (n<=1): exactly ONE component is NOT an error — just hide the
    // panel so a solo solid has no clutter, and keep the uniform steel-blue look.
    if (n <= 1 || list.length <= 1){
      applyComponentColors();                           // ensure uniform baseline
      return;
    }
    sceneComponents = list;
    componentsBox.style.display = 'block';
    renderComponentList();
    applyComponentColors();                             // paint per current mode
  } catch(_){ /* transient fetch error → panel stays hidden */ }
}

function renderComponentList(){
  const n = sceneComponents.length;
  const totalFaces = sceneComponents.reduce((a, c)=> a + c.face_indices.length, 0);
  compSummary.textContent = `Components: ${n} bodies`;
  compList.innerHTML = '';
  sceneComponents.forEach((c, i)=>{
    const vol = (typeof c.volume_mm3 === 'number')
      ? ` · ${c.volume_mm3.toLocaleString(undefined,{maximumFractionDigits:1})} mm³` : '';
    const row = document.createElement('div');
    row.className = 'comp'; row.dataset.i = i;
    row.innerHTML =
      `<span class="swatch" style="background:${c.hue}"></span>` +
      `<span class="ctext"><span class="cn">${c.label}</span>` +
      `<span class="cm">${c.face_count} face${vol}</span></span>` +
      `<span class="eye" title="숨기기/보이기">👁</span>`;
    // HOVER → accent all this component's faces (reuses highlightFaces set logic)
    row.onmouseenter = ()=> hoverComponent(i);
    row.onmouseleave = ()=> unhoverComponent(i);
    // CLICK (row body, not the eye) → SELECT this component + dim the others
    row.onclick = (e)=>{ if (e.target.classList.contains('eye')) return; selectComponent(i); };
    // EYE → ISOLATE: hide/show this component's faceMeshes
    row.querySelector('.eye').onclick = (e)=>{ e.stopPropagation(); toggleComponentHidden(i); };
    compList.appendChild(row);
  });
  void totalFaces;   // (kept for future 'N of M faces mapped' summary)
}

// ── (2) COLOR-BY-COMPONENT ──────────────────────────────────────────────────
// Apply the current colour mode to faceMeshes[]. 'uniform' = every face back to
// BASE_COLOR (the classic blue blob); 'bycomponent' = each component's faces get
// its palette hue. Selection dimming + hover accent are layered ON TOP of this
// baseline (they restore to whatever this function set, via getHex() snapshots).
function componentBaseHex(i){
  return compColor(i, sceneComponents.length).getHex();
}
function applyComponentColors(){
  // A section view swaps out the real faceMeshes[] — colouring is a no-op then.
  if (sectionAxis) return;
  if (compColorMode === 'bycomponent' && sceneComponents.length){
    // dim toward grey when a different component is selected (focus the pick)
    for (let ci = 0; ci < sceneComponents.length; ci++){
      const dim = (compSelected !== -1 && compSelected !== ci);
      const base = componentBaseHex(ci);
      for (const idx of sceneComponents[ci].face_indices){
        const m = faceMeshes[idx];
        if (!m || !m.material) continue;
        m.material.color.setHex(base);
        if (dim){ m.material.color.lerp(new THREE.Color(0xd7dbe0), 0.75); }
        m.material.emissive.setHex(0x000000);
      }
    }
  } else {
    // uniform: everything back to steel-blue
    for (const m of faceMeshes){
      if (!m || !m.material) continue;
      m.material.color.setHex(BASE_COLOR);
      m.material.emissive.setHex(0x000000);
    }
  }
  // re-assert hidden components (colour pass doesn't touch visibility, but a
  // hover/highlight cycle may have run clearFeatureHighlight over them)
  reapplyHidden();
  // re-accent a hovered row on top of the fresh baseline
  if (compHovered !== -1 && sceneComponents[compHovered]){
    highlightFaces(sceneComponents[compHovered].face_indices);
  }
}
function setColorMode(mode){
  compColorMode = mode;
  compUniformBtn.classList.toggle('on', mode === 'uniform');
  compByCompBtn.classList.toggle('on', mode === 'bycomponent');
  clearFeatureHighlight();   // drop any stale accent snapshots before repaint
  applyComponentColors();
}
compUniformBtn.onclick = ()=> setColorMode('uniform');
compByCompBtn.onclick  = ()=> setColorMode('bycomponent');

// ── (3) HOVER → accent all faces of a component ─────────────────────────────
function hoverComponent(i){
  const c = sceneComponents[i];
  if (!c) return;
  compHovered = i;
  compList.querySelectorAll('.comp').forEach(e=>
    e.classList.toggle('hov', +e.dataset.i === i));
  highlightFaces(c.face_indices);        // reuse the feature-overlay accent set
}
function unhoverComponent(i){
  compHovered = -1;
  // leaving the row: drop the accent, then restore the colour-mode baseline so a
  // by-component tint (or the selection dim) comes back instead of a hole.
  clearFeatureHighlight();
  applyComponentColors();
}

// ── (3) CLICK → SELECT this component (stash its 1st face) + dim the others ──
async function selectComponent(i){
  const c = sceneComponents[i];
  if (!c) return;
  compSelected = i;
  compList.querySelectorAll('.comp').forEach(e=>
    e.classList.toggle('on', +e.dataset.i === i));
  // dim others by repainting in by-component mode (auto-switch so the dim reads);
  // in uniform mode we still accent the selected body's faces so it stands out.
  if (compColorMode === 'uniform') setColorMode('bycomponent');
  else applyComponentColors();
  highlightFaces(c.face_indices);        // keep the selected body accented
  // Stash the component's representative (first) face via the SAME /pick path a
  // manual face click uses — so 'clicked the bolt in the list' == 'picked its
  // face', and Claude can act on 'the bolt' from cad_get_selection.
  const faceIdx = (c.face_indices && c.face_indices.length) ? c.face_indices[0] : null;
  if (faceIdx == null || !currentBodyId) return;
  try {
    const resp = await fetch('/pick', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ body_id: currentBodyId, face_idx: faceIdx }) });
    const s = await resp.json();
    const selBox = document.getElementById('sel');
    if (!s.ok){ selBox.style.display='none'; return; }
    selBox.style.display='block';
    selBox.innerHTML =
      `<b>${c.label} 선택됨</b> · ${c.face_count} face · rep face #${s.face_idx} (${s.surface_type})<br>` +
      `centroid [${s.centroid.join(', ')}]<br>` +
      `area ${s.area_mm2} mm²<br><br>` +
      `Claude에게: <i>"방금 고른 ${c.label}을(를) 처리해줘"</i><br>` +
      `<span style="color:#8a94a3">selector: <code>${JSON.stringify(s.selector)}</code></span>`;
  } catch(err){ document.getElementById('err').textContent = 'pick 실패: '+err.message; }
}

// ── (4) ISOLATE — hide/show a component's faceMeshes ────────────────────────
function reapplyHidden(){
  for (const ci of compHidden){
    const c = sceneComponents[ci];
    if (!c) continue;
    for (const idx of c.face_indices){
      const m = faceMeshes[idx];
      if (m) m.visible = false;
    }
  }
}
function toggleComponentHidden(i){
  const c = sceneComponents[i];
  if (!c) return;
  const nowHidden = !compHidden.has(i);
  if (nowHidden) compHidden.add(i); else compHidden.delete(i);
  for (const idx of c.face_indices){
    const m = faceMeshes[idx];
    if (m) m.visible = !nowHidden;
  }
  const row = compList.querySelector(`.comp[data-i="${i}"]`);
  if (row){
    row.classList.toggle('hidden', nowHidden);
    row.querySelector('.eye').textContent = nowHidden ? '🚫' : '👁';
  }
}
compShowAllBtn.onclick = ()=>{
  compHidden.clear();
  for (const m of faceMeshes){ if (m) m.visible = true; }
  compList.querySelectorAll('.comp').forEach(e=>{
    e.classList.remove('hidden');
    const eye = e.querySelector('.eye'); if (eye) eye.textContent = '👁';
  });
};

// ══════════════════════════════════════════════════════════════════════════
// V3 (2) SECTION SLIDER — X/Y/Z + 0..1 slider swap the DISPLAYED glb to
// /section?body_id&axis&pos (TRANSIENT — does NOT change currentBodyId or the
// body's lineage). 'OFF' restores /model. Slider is debounced (~150ms).
// ══════════════════════════════════════════════════════════════════════════
const secSlider = document.getElementById('secSlider');
const secOff = document.getElementById('secOff');
const secBtns = { x: document.getElementById('secX'),
                  y: document.getElementById('secY'),
                  z: document.getElementById('secZ') };
let sectionAxis = null;          // null = section OFF (showing /model)
let sectionDebounce = null;

function resetSection(){
  // restore UI to OFF; does NOT reload the model (caller loads it)
  sectionAxis = null;
  clearTimeout(sectionDebounce); sectionDebounce = null;
  secSlider.disabled = true;
  Object.values(secBtns).forEach(b=> b.classList.remove('on'));
}
async function applySection(){
  if (!sectionAxis || !currentBodyId) return;
  const pos = parseFloat(secSlider.value);
  const url = `/section?body_id=${encodeURIComponent(currentBodyId)}`
            + `&axis=${sectionAxis}&pos=${pos}`;
  try {
    // TRANSIENT swap: rebuildFaces=false → does NOT touch faceMeshes[] (the
    // section's primitives are NOT the body's OCCT faces) or currentBodyId.
    await loadGlbInto(url, false);
    document.getElementById('hud').textContent =
      `${currentBodyId} · SECTION ${sectionAxis.toUpperCase()} @ ${pos.toFixed(2)} (transient view)`;
  } catch(e){
    document.getElementById('err').textContent = 'section 실패: ' + e.message;
  }
}
function setSectionAxis(axis){
  if (!currentBodyId) return;
  sectionAxis = axis;
  secSlider.disabled = false;
  Object.entries(secBtns).forEach(([k,b])=> b.classList.toggle('on', k===axis));
  // picking/feature highlight is meaningless on the transient section mesh
  clearHighlight(); clearFeatureHighlight();
  applySection();
}
secBtns.x.onclick = ()=> setSectionAxis('x');
secBtns.y.onclick = ()=> setSectionAxis('y');
secBtns.z.onclick = ()=> setSectionAxis('z');
secSlider.oninput = ()=>{
  if (!sectionAxis) return;
  clearTimeout(sectionDebounce);
  sectionDebounce = setTimeout(applySection, 150);   // debounce so it doesn't spam the server
};
secOff.onclick = ()=>{
  const wasOn = sectionAxis !== null;
  resetSection();
  // restore the real body GLB (transient section discarded, lineage untouched)
  if (wasOn && currentBodyId){
    loadGlbInto('/model/'+encodeURIComponent(currentBodyId)+'.glb', true)
      .then(()=>{
        // faceMeshes[] was rebuilt fresh (BASE_COLOR, all visible) → re-assert the
        // component colour mode + isolate/hide state so section round-trip is lossless.
        applyComponentColors();
        document.getElementById('hud').textContent =
          `${currentBodyId} · ${faceMeshes.length} face-primitive · Section OFF`;
      })
      .catch(e=> document.getElementById('err').textContent = '복원 실패: '+e.message);
  }
};

// ══════════════════════════════════════════════════════════════════════════
// V3 (3) MEASURE — 'Measure' toggle. When ON, the next TWO face picks are
// captured as a,b; the straight-line distance is computed CLIENT-SIDE
// (Vector3.distanceTo on the two hit points), shown as two centroid markers,
// a dashed line + a label. Labelled 'point-to-point (click distance)' — this
// is the instant visual, NOT the true skill-based measure (that's the MCP track).
// ══════════════════════════════════════════════════════════════════════════
const btnMeasure = document.getElementById('btnMeasure');
const measureBox = document.getElementById('measure');
let measureMode = false;
let measurePts = [];             // [Vector3, Vector3] world hit points
let measureMarkers = [];         // small spheres at each measured point
let measureLine = null;          // dashed THREE.Line between the two points

function clearMeasureViz(){
  for (const m of measureMarkers) scene.remove(m);
  measureMarkers = [];
  if (measureLine){ scene.remove(measureLine); measureLine.geometry.dispose(); measureLine.material.dispose(); measureLine = null; }
}
function resetMeasure(){
  measurePts = [];
  clearMeasureViz();
  measureBox.style.display = 'none';
}
function measureMarker(p){
  const box = new THREE.Box3().setFromObject(current || scene);
  const r = (box.getSize(new THREE.Vector3()).length() * 0.01) || 0.3;
  const s = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10),
                           new THREE.MeshBasicMaterial({ color:0xe07b00 }));
  s.position.copy(p); scene.add(s); measureMarkers.push(s);
}
function addMeasurePoint(p){
  if (measurePts.length >= 2) resetMeasure();      // third pick starts a new measurement
  measurePts.push(p.clone());
  measureMarker(p);
  measureBox.style.display = 'block';
  if (measurePts.length === 1){
    measureBox.innerHTML = `<b>Measure</b> · 점 A 선택됨<br>` +
      `<span class="hint">두 번째 면을 클릭하세요</span>`;
  } else {
    const a = measurePts[0], b = measurePts[1];
    // client-side straight-line distance; GLB coords are metres → ×1000 = mm
    const dMm = a.distanceTo(b) * 1000;
    const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
    measureLine = new THREE.Line(geo,
      new THREE.LineDashedMaterial({ color:0xe07b00, dashSize:(a.distanceTo(b)*0.04)||0.2,
                                     gapSize:(a.distanceTo(b)*0.025)||0.12, linewidth:2 }));
    measureLine.computeLineDistances();            // required for dashes to render
    scene.add(measureLine);
    measureBox.innerHTML =
      `<b>${dMm.toFixed(2)} mm</b><br>` +
      `<span class="hint">point-to-point (click distance)</span>`;
  }
}
btnMeasure.onclick = ()=>{
  measureMode = !measureMode;
  btnMeasure.classList.toggle('on', measureMode);
  if (measureMode){
    measureBox.style.display = 'block';
    measureBox.innerHTML = `<b>Measure ON</b><br>` +
      `<span class="hint">두 면을 클릭 → 점-점 거리</span>`;
  } else {
    resetMeasure();
  }
};

// ── V3 AUTO-REFRESH: poll /api/bodies; load a genuinely-new newest body, but never
//    steal the view/selection while the user is orbiting or has a face selected on it. ──
let lastNewestStem = null;
let currentMtime = 0;   // mtime of the shown stem's STEP — same-stem reload detection
window.__pollDbg = [];   // observability: last poll decisions (audit/testing hook)
function _dbg(rec){ window.__pollDbg.push(rec); if (window.__pollDbg.length > 30) window.__pollDbg.shift(); }
async function pollBodies(){
  try {
    const r = await fetch('/api/bodies'); const d = await r.json();
    if (!d.bodies || !d.bodies.length) return;
    // busy = mid-orbit OR the selection panel is showing (face OR component pick —
    // audit: `highlighted` missed component selections and never expired; #sel
    // visibility is the honest proxy for "user is working with this view")
    const selVisible = document.getElementById('sel').style.display === 'block';
    const busy = pointerDown || selVisible;
    // SAME-STEM RELOAD (audit: the pick→modify→export loop never closed): if the
    // STEP behind the CURRENT body was overwritten (cad_export back to the same
    // stem), reload it in place. mtime comes from /api/bodies.
    const cur = d.bodies.find(b => b.body_id === currentBodyId);
    _dbg({ t: Date.now()%1e6, cur: cur && cur.body_id, curM: cur && cur.mtime,
           mem: currentMtime, busy, sel: selVisible });
    if (cur){
      if (!currentMtime) currentMtime = cur.mtime;      // init on first sight
      else if (cur.mtime > currentMtime + 1e-6){
        if (busy){   // selection targets OUTDATED geometry — say so, reload later
          document.getElementById('hud').textContent =
            `${currentBodyId} · 형상이 갱신됨 — 선택 해제 시 자동 리로드`;
          return;
        }
        const prev = currentMtime;   // commit AFTER success — a transient load
        _dbg({ reload: currentBodyId });   // failure must RETRY next poll (a silent
        try {                              // one-shot loss was observed live)
          await loadBody(currentBodyId);   // reload in place
          currentMtime = cur.mtime;
        } catch (e) { currentMtime = prev; _dbg({ reloadErr: String(e).slice(0,120) }); }
        return;
      }
    }
    const newest = d.bodies[0].body_id;
    if (newest === lastNewestStem) return;              // nothing new
    if (newest === currentBodyId){ lastNewestStem = newest; return; }
    if (busy) return;   // do NOT consume lastNewestStem — retry when selection clears
    lastNewestStem = newest;                            // (audit: was consumed BEFORE
    await loadBodies();                                 // the guard → stems dropped)
  } catch(err){ _dbg({ err: String(err).slice(0, 200) }); }
}
setInterval(pollBodies, 1500);

// ── face PICK: click a face → server maps face_idx → OCCT face → show selector ──
// DRAG-VS-CLICK: a pick requires (a) movement < ~9px AND (b) pointerup within ~300ms of
// pointerdown. A slow careful click used to be eaten as orbit; the time+distance window
// fixes that. If a drag is consumed, flash an 'orbit (not a pick)' hint.
let downPos = null;
let downTime = 0;
let pointerDown = false;
const MOVE_PX = 9;          // drag threshold (raised from 5)
const CLICK_MS = 300;       // must release within this window to count as a pick

const dragHint = document.getElementById('dragHint');
let dragHintTimer = null;
function flashDragHint(){
  dragHint.classList.add('show');
  clearTimeout(dragHintTimer);
  dragHintTimer = setTimeout(()=>dragHint.classList.remove('show'), 700);
}

renderer.domElement.addEventListener('pointerdown', e => {
  downPos = [e.clientX, e.clientY]; downTime = performance.now(); pointerDown = true;
});
renderer.domElement.addEventListener('pointerup', async e => {
  pointerDown = false;
  if (!downPos || !current || !currentBodyId){ downPos = null; return; }
  const moved = Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]);
  const dt = performance.now() - downTime;
  downPos = null;
  if (e.button !== 0) return;                  // non-left = pan/context, not a pick
  if (moved > MOVE_PX || dt > CLICK_MS){       // dragged OR held too long = orbit
    if (moved > MOVE_PX) flashDragHint();
    return;
  }

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX-rect.left)/rect.width)*2 - 1;
  pointer.y = -((e.clientY-rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(current, true);
  if (!hits.length){ if (!measureMode) document.getElementById('sel').style.display='none'; return; }
  const p = hits[0].point;   // 3D world point on the surface (fallback field only)

  // V3 MEASURE: in measure mode a pick is a distance point, NOT a face stash.
  // Capture the hit point and (on the 2nd) draw the dashed line + client distance.
  if (measureMode){ addMeasurePoint(p); return; }

  // F1: the hit mesh's traverse index IS the OCCT face index (GLB is 1:1 with _all_faces()).
  const faceIdx = faceMeshes.indexOf(hits[0].object);

  // V-보조 HIGHLIGHT: restore the previous face, accent the hit face so the user SEES
  // which face was chosen (and can catch a server mispick visually).
  clearHighlight();
  if (faceIdx >= 0){
    const m = hits[0].object;
    highlighted = { mesh: m, color: m.material.color.getHex() };
    m.material.color.copy(ACCENT);
    m.material.emissive.copy(ACCENT);
    m.material.emissiveIntensity = 0.45;
  }

  // marker at the pick point (visual reference)
  if (marker) scene.remove(marker);
  const box = new THREE.Box3().setFromObject(current);
  const r = box.getSize(new THREE.Vector3()).length() * 0.012 || 0.5;
  marker = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                          new THREE.MeshBasicMaterial({ color:0xff5533 }));
  marker.position.copy(p); scene.add(marker);

  // Tell the server WHICH face by index; it maps faces[face_idx] directly (no centroid search).
  // point[] kept as a fallback field only.
  try {
    const resp = await fetch('/pick', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ body_id: currentBodyId, face_idx: faceIdx, point:[p.x, p.y, p.z] }) });
    const s = await resp.json();
    const selBox = document.getElementById('sel');
    if (!s.ok){ selBox.style.display='none'; return; }
    const sel = JSON.stringify(s.selector);
    selBox.style.display='block';
    selBox.innerHTML =
      `<b>면 선택됨</b> · face #${s.face_idx} (${s.surface_type})<br>` +
      `centroid [${s.centroid.join(', ')}]<br>` +
      `area ${s.area_mm2} mm²<br><br>` +
      `Claude에게: <i>"방금 클릭한 면을 3mm 필렛해줘"</i><br>` +
      `<span style="color:#8a94a3">selector: <code>${sel}</code></span>`;
  } catch(err){ document.getElementById('err').textContent = 'pick 실패: '+err.message; }
});

(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
loadBodies();
</script>
</body>
</html>
