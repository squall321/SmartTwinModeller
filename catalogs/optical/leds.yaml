    length_mm: 1.0
    width_mm: 0.5
    height_mm: 0.45
    pad_size_mm: [0.6, 0.6]
    pad_spacing_mm: 0.9
  "0603":
    length_mm: 1.6
    width_mm: 0.8
    height_mm: 0.6
    pad_size_mm: [0.8, 0.8]
    pad_spacing_mm: 1.4
  "0805":
    length_mm: 2.0
    width_mm: 1.25
    height_mm: 0.8
    pad_size_mm: [1.0, 1.2]
    pad_spacing_mm: 1.8
  "1206":
    length_mm: 3.2
    width_mm: 1.6
    height_mm: 1.1
    pad_size_mm: [1.2, 1.6]
    pad_spacing_mm: 2.8
  "5050":
    length_mm: 5.0
