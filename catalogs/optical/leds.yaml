# Surface-mount LED packages — typical chip-LED footprints.
# length_mm / width_mm : LED body footprint
# height_mm            : package height above PCB (top of plastic dome)
# pad_size_mm          : tuple-style [length_mm, width_mm] of a single SMT pad
# pad_spacing_mm       : center-to-center distance between the two pads
schema_version: 1
standard: "Industry standard SMD LED chip packages"
leds:
