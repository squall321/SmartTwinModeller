# Hex nuts per DIN 934 / ISO 4032. All dimensions mm.
#
# - across_flats_mm: nominal width across flats (s, wrench size)
# - thickness_mm:    nominal nut height (m)
#
# Used by hex nut-trap pockets: the pocket is a hex prism of size
# (across_flats + clearance) by `thickness` (unless overridden).
schema_version: 1
standard: "DIN 934 / ISO 4032"
nuts:
  M2:
    across_flats_mm: 4.0
    thickness_mm:    1.6
  M2.5:
    across_flats_mm: 5.0
    thickness_mm:    2.0
  M3:
    across_flats_mm: 5.5
    thickness_mm:    2.4
  M4:
    across_flats_mm: 7.0
    thickness_mm:    3.2
  M5:
    across_flats_mm: 8.0
    thickness_mm:    4.0
  M6:
    across_flats_mm: 10.0
    thickness_mm:    5.0
  M8:
    across_flats_mm: 13.0
    thickness_mm:    6.5
  M10:
    across_flats_mm: 16.0
    thickness_mm:    8.0
