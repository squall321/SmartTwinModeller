# Helicoil (wire thread) inserts — ISO metric STI (Screw Thread Insert) data.
# `tap_drill_mm` is the recommended STI tap drill diameter for the threaded
# bore that receives the wire coil. Free-running insert lengths are listed by
# the standard length multiples 1xD / 1.5xD / 2xD (D = nominal screw size).
# Units: mm.
inserts:
  M3:
    tap_drill_mm: 3.10
    lengths_mm:
      "1xD":   3.0
      "1.5xD": 4.5
      "2xD":   6.0
