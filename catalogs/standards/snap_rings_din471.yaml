# External retaining rings per DIN 471. All dimensions in mm.
#
# - shaft_d_mm:       nominal shaft diameter the ring snaps onto
# - groove_d_mm:      diameter at the bottom of the shaft groove (< shaft_d)
# - groove_width_mm:  axial width of the groove (slightly > ring thickness)
#
# Values are taken from the DIN 471 table for standard heavy series.
schema_version: 1
standard: "DIN 471"
rings:
  "4":
    shaft_d_mm: 4.0
    groove_d_mm: 3.8
    groove_width_mm: 0.50
