# Internal retaining rings per DIN 472. All dimensions in mm.
#
# - bore_d_mm:        nominal bore diameter the ring snaps into
# - groove_d_mm:      diameter at the bottom of the bore groove (> bore_d)
# - groove_width_mm:  axial width of the groove (slightly > ring thickness)
#
# Values are taken from the DIN 472 table for standard series.
schema_version: 1
