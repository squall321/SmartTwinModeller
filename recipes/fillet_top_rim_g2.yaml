name: fillet_top_rim_g2
intent_en: Fillet the top-face rim with a curvature-continuous G2 blend (Class-A
  cosmetic edge) using edges_on_face(faces_by_normal +Z)
intent_kr: 윗면 테두리를 G2 곡률연속 필렛(Class-A 스타일)으로 둥글려줘
tags:
- fillet
- g2
- class-a
- cosmetic
- rim
- continuity
spec:
- op: box
  args:
    length_mm: 30
    width_mm: 30
    height_mm: 10
- op: fillet_edges_by_predicate
  args:
    selector:
      kind: edges_on_face
      face:
        kind: faces_by_normal
        direction:
        - 0.0
        - 0.0
        - 1.0
        tol_deg: 5.0
    radius_mm: 2
    continuity: g2
expected:
  is_solid: true
  volume_mm3:
  - 8722.058
  - 9078.06
  bbox_mm:
  - - 29.65
    - 29.65
    - 9.85
  - - 30.35
    - 30.35
    - 10.15
  notes: edges_on_face(face=faces_by_normal +Z) is the 'rim of the top face' idiom;
    continuity='g2' requests a curvature-continuous blend.
