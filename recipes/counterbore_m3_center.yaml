name: counterbore_m3_center
intent_en: Add an M3 counterbore hole (socket-head cap screw seat) at the center
  of the top face
intent_kr: 윗면 중앙에 M3 카운터보어 구멍(육각 소켓 머리 자리)을 가공해줘
tags:
- counterbore
- hole
- m3
- screw
- cap
- seat
spec:
- op: box
  args:
    length_mm: 30
    width_mm: 30
    height_mm: 10
- op: counterbore_hole
  args:
    face_selector:
      kind: faces_by_normal
      direction:
      - 0.0
      - 0.0
      - 1.0
      tol_deg: 5.0
    thread_spec: M3
    fit: medium
    depth_mm: 6
expected:
  is_solid: true
  volume_mm3:
  - 8670.726
  - 9024.634
  bbox_mm:
  - - 29.65
    - 29.65
    - 9.85
  - - 30.35
    - 30.35
    - 10.15
  notes: thread_spec ('M3') pulls bore/counterbore diameters from the metric fastener
    catalog; depth_mm is the shaft depth BELOW the counterbore floor.
