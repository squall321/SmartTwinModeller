name: shell_open_top_tray
intent_en: 'Hollow a block into an open-top tray: remove the top face and shell
  all remaining walls to 2 mm (NOT-selector idiom)'
intent_kr: 블록 윗면을 열고 나머지 벽을 두께 2mm 로 쉘링해서 트레이를 만들어줘
tags:
- shell
- hollow
- tray
- open
- thickness
- enclosure
spec:
- op: box
  args:
    length_mm: 40
    width_mm: 30
    height_mm: 20
- op: shell_variable_thickness
  args:
    face_thickness_map:
    - face_selector:
        kind: not
        inner:
          kind: faces_by_normal
          direction:
          - 0.0
          - 0.0
          - 1.0
          tol_deg: 5.0
      thickness_mm: 2.0
expected:
  is_solid: true
  volume_mm3:
  - 7008.96
  - 7295.04
  bbox_mm:
  - - 39.55
    - 29.65
    - 19.75
  - - 40.45
    - 30.35
    - 20.25
  notes: Faces IN the map keep their thickness; faces NOT in the map are REMOVED
    (opened) when default_thickness_mm is null — so not(faces_by_normal +Z) shells
    everything except the top, which opens.
