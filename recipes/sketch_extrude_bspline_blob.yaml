        - 12
      - - -7
        - 6
      - - -12
        - 0
      - - -6
        - -6
      - - 0
        - -12
      - - 7
        - -6
    height_mm: 5
expected:
  is_solid: true
  volume_mm3:
  - 1538.927
  - 1601.741
  bbox_mm:
  - - 25.744
    - 25.112
    - 4.9
  - - 26.366
    - 25.72
    - 5.1
  notes: bspline_closed INTERPOLATES through fit_points (curve passes through them)
