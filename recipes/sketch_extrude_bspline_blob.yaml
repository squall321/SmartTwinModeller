name: sketch_extrude_bspline_blob
intent_en: Extrude a smooth free-form blob through interpolation fit points (closed
  periodic B-spline) 5 mm thick
intent_kr: 지정한 점들을 지나는 부드러운 폐곡선(B-스플라인) 단면을 5mm 돌출시켜줘
tags:
- sketch
- extrude
- bspline
- freeform
- blob
- interpolate
spec:
