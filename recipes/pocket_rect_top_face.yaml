name: pocket_rect_top_face
intent_en: Cut a rectangular pocket 4 mm deep into the TOP face selected by its
  +Z normal (faces_by_normal selector idiom)
intent_kr: faces_by_normal 셀렉터로 윗면을 골라 30x20 사각 포켓을 깊이 4mm 파줘
tags:
- pocket
- rectangular
- top
- face
- selector
- normal
spec:
- op: box
  args:
    length_mm: 60
    width_mm: 40
    height_mm: 10
- op: extrude_pocket
  args:
    face_selector:
      kind: faces_by_normal
      direction:
      - 0.0
      - 0.0
      - 1.0
      tol_deg: 5.0
    sketch:
      kind: rectangle
      length_mm: 30
      width_mm: 20
    depth_mm: 4
expected:
  is_solid: true
  volume_mm3:
  - 21168.0
  - 22032.0
  bbox_mm:
  - - 59.35
    - 39.55
    - 9.85
  - - 60.65
    - 40.45
    - 10.15
  notes: 'THE face-selector idiom: faces_by_normal {direction:[0,0,1]} picks the
    top planar face; the sketch is anchored at the FACE CENTER (sketch center offsets
    are face-local).'
