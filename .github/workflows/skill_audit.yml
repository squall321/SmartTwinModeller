name: skill_audit

# C3: Weekly skill audit run (phone_designer.skills.audit) — non-blocking,
# exports the history-rule catalog report as an artifact for manual review.
# Catches slow drift (façade regressions, broken default applies) that the
# fidelity gate doesn't surface directly.

on:
  schedule:
    # Every Monday 03:00 UTC (~ Mon 12:00 KST). Cron is in UTC on GitHub Actions.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}  # allow manual kick

concurrency:
  group: skill-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: skill audit summary
    runs-on: windows-latest
    # NOT required — see branch protection. This job is review-only.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project + dev extras
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip wheel setuptools
          venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run skill audit (python -m phone_designer.skills.audit)
        shell: pwsh
        # Review-only job: the audit exits 1 when any skill fails its default
        # apply — keep the weekly run green and inspect the report artifact.
        continue-on-error: true
        timeout-minutes: 45
        env:
          PYTHONUTF8: "1"
          # Defense in depth — launch_ui_panel is skipped below (it enters the
          # Qt event loop / crashes VTK OpenGL on headless runners), but force
          # headless anyway in case another skill grows a UI path.
          PHONE_DESIGNER_UI_HEADLESS: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Path run_logs\_tmp -Force | Out-Null
          venv\Scripts\python.exe -m phone_designer.skills.audit --out run_logs\_tmp\history_rule_catalog.md --skip launch_ui_panel

      - name: Upload skill audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-audit-${{ github.run_id }}
          path: run_logs/_tmp/history_rule_catalog.md
          if-no-files-found: warn
          retention-days: 90

      - name: Print audit summary to job log
        if: always()
        shell: pwsh
        run: |
          $p = "run_logs\_tmp\history_rule_catalog.md"
          if (Test-Path $p) {
            # Header block only (totals + pass/fail counts) — full table is the artifact.
            Get-Content $p -TotalCount 15
          } else {
            Write-Output "history_rule_catalog.md was not produced — audit crashed before writing the report."
          }
