name: phase6_synth_smoke
description: |
  Phase 6 housing 합성 smoke — ComponentArrangement → Plan → STEP → viewport.

phase: 6

inputs: []

steps:
  - kind: import_check
    modules:
      - phone_designer.components
      - phone_designer.components.model
      - phone_designer.components.arrangement
      - phone_designer.components.collision
      - phone_designer.components.catalog_loader
      - phone_designer.components.extract
      - phone_designer.planner
      - phone_designer.planner.housing_synth_rule
  - kind: run_python
    script: -m pytest tests/components -v --tb=short
    timeout_s: 120
  - kind: run_python
    script: -m phone_designer synthesize --arrangement catalogs/arrangements/watch_5part.yaml --out-plan run_logs/_tmp/synth.yaml --out-step run_logs/_tmp/synth.step
    timeout_s: 180
  - kind: check_file_exists
    paths:
      - run_logs/_tmp/synth.yaml
      - run_logs/_tmp/synth.step
  - kind: viewport_offscreen
    label: synth_housing
    load_step: run_logs/_tmp/synth.step
    views: [iso, top, side, front]
  - kind: system_info
  - kind: log_summary
    expect:
      level_counts:
        ERROR: {max: 0}
        WARNING: {max: 10}

expected:
  outcome: PASS

mail:
  subject_template: "[PhoneDesigner] {scenario} — {outcome}"
